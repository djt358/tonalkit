# cargo-deny policy. See spec §11.1 and plan Global Constraints.

[graph]
all-features = true

[advisories]
version = 2
# paste is unmaintained, not vulnerable; it is a proc-macro reached only through pyin's dependencies.
ignore = [{ id = "RUSTSEC-2024-0436", reason = "paste is unmaintained (not vulnerable); transitive proc-macro via pyin -> statrs -> nalgebra -> simba; revisit when pyin's dependencies move" }]

[licenses]
version = 2
# Anything not listed here is denied, which is how GPL, LGPL, AGPL and SSPL stay out.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
# The allow list and the exception are policy, not an inventory: do not warn while the current
# dependency tree happens not to use them.
unused-allowed-license = "allow"
unused-license-exception = "allow"
# MPL-2.0 is file-level copyleft: accepted only for the UniFFI toolchain (Task 12). cargo-deny
# matches exception crate names exactly (no globs), so this lists exactly the `uniffi*` crates in
# the graph (uniffi 0.32.2, all features). A `uniffi*` crate that is not listed fails the licenses
# check, which is the safe direction; after a uniffi upgrade, re-run `cargo deny check` and
# `grep -A1 '^name = "uniffi' Cargo.lock` and adjust the list.
exceptions = [
    { allow = ["MPL-2.0"], crate = "uniffi" },
    { allow = ["MPL-2.0"], crate = "uniffi_bindgen" },
    { allow = ["MPL-2.0"], crate = "uniffi_core" },
    { allow = ["MPL-2.0"], crate = "uniffi_internal_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_meta" },
    { allow = ["MPL-2.0"], crate = "uniffi_pipeline" },
    { allow = ["MPL-2.0"], crate = "uniffi_udl" },
    # Build-time only (via pyo3-build-config, for tonekit-py); the LLVM exception only relaxes Apache-2.0.
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "target-lexicon" },
]

[bans]
multiple-versions = "warn"
# UniFFI's proc-macros and bindings generator read Cargo.toml with the 1.x `toml` family, while
# tonekit-pack stays on toml 0.8. Both are build-time only (the iOS library links none of it).
skip = [
    { crate = "toml@1", reason = "uniffi_macros and uniffi_bindgen (build-time); tonekit-pack uses toml 0.8" },
    { crate = "toml_datetime@1", reason = "via toml 1.x, see above" },
    { crate = "serde_spanned@1", reason = "via toml 1.x, see above" },
    { crate = "winnow@1", reason = "via toml 1.x and askama_parser (uniffi_bindgen, build-time)" },
    { crate = "getrandom@0.4", reason = "via tempfile (uniffi_pipeline <- uniffi_meta <- uniffi_macros; proc-macro/host only)" },
]
# tonekit is on-device and offline: no network or TLS stacks, direct or transitive.
deny = [
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "ureq" },
    { crate = "rustls" },
    { crate = "native-tls" },
    { crate = "openssl" },
    { crate = "curl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

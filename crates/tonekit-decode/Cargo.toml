[package]
name = "tonekit-decode"
version = "0.1.0"
description = "Closed-set candidate decoding of any syllable count and the open per-syllable tone lattice for tonekit."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tonekit-core = { path = "../tonekit-core" }
tonekit-pack = { path = "../tonekit-pack" }
tonekit-shape = { path = "../tonekit-shape" }
tonekit-segment = { path = "../tonekit-segment" }

[dev-dependencies]
tonekit-f0 = { path = "../tonekit-f0" }
tonekit-testkit = { path = "../tonekit-testkit" }
approx = { workspace = true }

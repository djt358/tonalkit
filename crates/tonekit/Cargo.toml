[package]
name = "tonekit"
version = "0.1.0"
description = "Lexical-tone assessment facade: analyse audio once, then decode candidates, build the open tone lattice or grade an utterance."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tonekit-core = { path = "../tonekit-core" }
tonekit-decode = { path = "../tonekit-decode" }
tonekit-f0 = { path = "../tonekit-f0" }
tonekit-fuse = { path = "../tonekit-fuse" }
tonekit-pack = { path = "../tonekit-pack" }
tonekit-segment = { path = "../tonekit-segment" }
tonekit-shape = { path = "../tonekit-shape" }
serde = { workspace = true }

[dev-dependencies]
tonekit-testkit = { path = "../tonekit-testkit" }
approx = { workspace = true }
insta = { workspace = true }
serde_json = { workspace = true }

[pack]
lect = "cmn"
version = "0.3.0"
tbu = "syllable"
capabilities = ["register"]
base_accent = "cmn-standard"
heard_threshold = 0.6
prior = { "1" = 0.22, "2" = 0.22, "3" = 0.16, "4" = 0.30, "5" = 0.10 }

[[tone]]
id = "1"
name = "阴平 high level"
chao = [5, 5]

[[tone]]
id = "2"
name = "阳平 rising"
chao = [3, 5]

[[tone]]
id = "3"
name = "上声 dipping"
chao = [2, 1, 4]

[[tone]]
id = "4"
name = "去声 falling"
chao = [5, 1]

[[tone]]
id = "5"
name = "轻声 neutral"
chao = "context"

[tolerance]
contour = 0.7
onset = 0.8
offset = 0.8
turning_point = 0.2

[[unvoiced_ok]]
tone = "3"
region = [0.3, 0.8]

[confusions]
pairs = [["2", "3"], ["1", "4"], ["1", "2"]]

# ---- base accent: Putonghua standard --------------------------------------------------
[[accent]]
id = "cmn-standard"
name = "普通话 (standard)"

# Non-final T3 is usually the half-third (low, falling). The full dip (Chao 2-1-4) is the classic
# learner over-production in this position, so it stays expected at lower weight (R47): an
# intended T3 keeps its credit, and a full dip no longer fits T2 better than T3. The weights are
# not fitted; absolute sharpness is the P1 calibration's job (R48).
[[accent.realize]]
label = "t3-half"
when = { tone = "3", phrase_final = false }
mixture = [ { chao = [2, 1], weight = 0.75 }, { chao = [2, 1, 4], weight = 0.25 } ]

[[accent.realize]]
label = "t5-after-1"
when = { tone = "5", prev = "1" }
chao = [2]

[[accent.realize]]
label = "t5-after-2"
when = { tone = "5", prev = "2" }
chao = [3]

[[accent.realize]]
label = "t5-after-3"
when = { tone = "5", prev = "3" }
chao = [4]

[[accent.realize]]
label = "t5-after-4"
when = { tone = "5", prev = "4" }
chao = [1]

# Fallback for a neutral tone with no previous syllable (rare; keeps every context resolvable).
[[accent.realize]]
label = "t5-default"
when = { tone = "5" }
chao = [3]

# Phrase-final T3 is often produced without the full rise even in the standard.
[[accent.realize]]
label = "t3-final-dip"
when = { tone = "3", phrase_final = true }
mixture = [ { chao = [2, 1, 4], weight = 0.6 }, { chao = [2, 1], weight = 0.4 } ]

# ---- Taiwan Mandarin (國語). Realisational differences only; lexical ones come from Bendy.
[[accent]]
id = "cmn-TW"
name = "國語 (Taiwan)"
inherits = "cmn-standard"

[[accent.realize]]
label = "t3-low"
when = { tone = "3" }
mixture = [ { chao = [2, 1], weight = 0.8 }, { chao = [2, 1, 3], weight = 0.2 } ]

[accent.tolerance]
contour = 0.8

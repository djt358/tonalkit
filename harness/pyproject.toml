[project]
name = "tonekit-harness"
version = "0.1.0"
description = "Evaluation harness for tonekit: corpus manifest, ingest, provenance check."
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2",
    # The Rust tonekit library, for evaluation, synthetic tests and calibration (JSON in, JSON
    # out). `uv sync` builds it with maturin, so a Rust toolchain must be on the PATH.
    "tonekit-py",
]

[project.scripts]
tkh = "tonekit_harness.cli:main"

[tool.uv.sources]
tonekit-py = { path = "../crates/tonekit-py" }

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tonekit_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

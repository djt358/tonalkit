[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
thiserror = "2"
approx = "0.5"
proptest = "1"
insta = { version = "1", features = ["json"] }

# Dependencies are compiled once and reused across test runs; optimise them even in dev builds.
[profile.dev.package."*"]
opt-level = 3

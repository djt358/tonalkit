name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, its issues or its packages.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The repository is public: no recordings of people, ever (scripts/check-no-audio.sh).
  no-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-no-audio.sh

  # The volunteer recording kit (kit/): node unit tests (resampler, trim, WAV, zip, order, ...),
  # then the whole flow in headless Chromium with the fixture as the microphone (kit/tests/e2e.py).
  # The bundles it exports are checked with the contract's own reader (check_bundle.py uses
  # `read_bundle` from the harness env once harness/src/tonekit_harness/contracts exists, and its
  # built-in checks before that). The harness env is installed without its native builds
  # (tonekit-py needs Rust, pyworld a C++ compiler): reading the contract needs pydantic only.
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --project harness --locked --no-install-project --no-install-package tonekit-py --no-install-package pyworld
      # The kit's test requirements go into that env, which then leads the PATH.
      - run: uv pip install --python harness/.venv -r kit/tests/requirements.txt
      - run: echo "$PWD/harness/.venv/bin" >> "$GITHUB_PATH"
      # The Python Playwright package's own install, so the browser build matches the package.
      - run: python -m playwright install --with-deps chromium
      - run: kit/tests/run.sh

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked

  # The declared rust-version (workspace Cargo.toml) is a promise: build the workspace on exactly
  # that toolchain. `+1.85` beats rust-toolchain.toml (which asks for stable). Keep in step with
  # `rust-version` there.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo +1.85 build --workspace --locked

  # cargo-deny reads Cargo.lock itself and brings its own binary: no Rust toolchain needed.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The default builds stay free of UniFFI, and the Swift bindings generate with the expected API.
  # (`cargo test --workspace` compiles with the `ffi` feature on, because the workspace includes
  # tonekit-ffi; this job builds the crates alone, as their other consumers do.)
  ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Default builds have no UniFFI
        run: |
          cargo check -p tonekit-core -p tonekit -p tonekit-cli --locked
          test "$(cargo tree -p tonekit-cli -e normal,build --locked | grep -c uniffi)" = 0
      - name: Swift bindings generate and have the expected API
        run: scripts/check-swift-bindings.sh

  # Task 12: the iOS build, proven on the Simulator (spec 4.3). Builds the XCFramework, then runs
  # the Swift tests in swift/TonekitSmoke against it.
  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      # `uv sync` builds tonekit-py (a path dependency) with maturin, which needs cargo.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run tkh provenance --register ../data-register.csv --packs-root ../packs

  # Task 13: the Python module (crates/tonekit-py). The harness depends on it, so `uv sync` builds
  # it with maturin (against the locked Cargo.lock), and its tests then check that Python gives the
  # CLI's numbers on the shared fixture (fixtures/spoken-413.*).
  python-bindings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked
      - run: uv run pytest ../crates/tonekit-py/tests
